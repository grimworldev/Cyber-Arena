<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crateWood" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9c7a45"/>
      <stop offset="1" stop-color="#6e5230"/>
    </linearGradient>
  </defs>

  <!-- bottom crate -->
  <rect x="16" y="130" width="224" height="110" fill="url(#crateWood)" stroke="#43301a" stroke-width="5"/>
  <line x1="16" y1="185" x2="240" y2="185" stroke="#43301a" stroke-width="3"/>
  <line x1="16" y1="130" x2="240" y2="240" stroke="#5a4226" stroke-width="2" opacity="0.5"/>
  <line x1="240" y1="130" x2="16" y2="240" stroke="#5a4226" stroke-width="2" opacity="0.5"/>

  <!-- top crate (smaller, offset) -->
  <rect x="46" y="30" width="150" height="104" fill="url(#crateWood)" stroke="#43301a" stroke-width="5"/>
  <line x1="46" y1="82" x2="196" y2="82" stroke="#43301a" stroke-width="3"/>
  <line x1="46" y1="30" x2="196" y2="134" stroke="#5a4226" stroke-width="2" opacity="0.5"/>
  <line x1="196" y1="30" x2="46" y2="134" stroke="#5a4226" stroke-width="2" opacity="0.5"/>

  <!-- metal corner brackets -->
  <rect x="16" y="130" width="18" height="18" fill="#8a8578"/>
  <rect x="222" y="130" width="18" height="18" fill="#8a8578"/>
  <rect x="16" y="222" width="18" height="18" fill="#8a8578"/>
  <rect x="222" y="222" width="18" height="18" fill="#8a8578"/>

  <!-- stenciled marking -->
  <rect x="90" y="55" width="60" height="16" fill="none" stroke="#2b2016" stroke-width="2"/>
  <text x="120" y="67" font-family="monospace" font-size="12" fill="#2b2016" text-anchor="middle">CARGO</text>
</svg>
