<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ashRockFill" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4540"/>
      <stop offset="1" stop-color="#2a2622"/>
    </linearGradient>
    <radialGradient id="emberCore" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- calcified stump base -->
  <path d="M40 246 L34 150 Q30 90 60 50 Q80 20 128 16 Q176 20 196 50 Q226 90 222 150 L216 246 Z"
        fill="url(#ashRockFill)" stroke="#161412" stroke-width="4" stroke-linejoin="round"/>

  <!-- crack texture -->
  <path d="M90 246 L100 160 L80 100" fill="none" stroke="#161412" stroke-width="2" opacity="0.7"/>
  <path d="M170 246 L160 160 L182 100" fill="none" stroke="#161412" stroke-width="2" opacity="0.7"/>
  <path d="M128 246 L128 130" fill="none" stroke="#161412" stroke-width="2" opacity="0.5"/>

  <!-- glowing ember cracks -->
  <path d="M90 246 L100 160 L80 100" fill="none" stroke="#ff8a3d" stroke-width="1" opacity="0.6"/>
  <path d="M170 246 L160 160 L182 100" fill="none" stroke="#ff8a3d" stroke-width="1" opacity="0.6"/>

  <!-- internal ember glow at fissure -->
  <ellipse cx="128" cy="190" rx="30" ry="18" fill="url(#emberCore)" opacity="0.7"/>

  <!-- ash dust settled on top -->
  <ellipse cx="128" cy="30" rx="60" ry="14" fill="#8a847a" opacity="0.5"/>

  <!-- surface soot speckle -->
  <circle cx="70" cy="120" r="2" fill="#161412"/>
  <circle cx="180" cy="140" r="2" fill="#161412"/>
  <circle cx="110" cy="200" r="1.5" fill="#161412"/>
</svg>
