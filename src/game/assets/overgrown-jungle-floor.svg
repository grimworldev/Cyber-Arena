<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="godRay" x1="0" y1="0" x2="30" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff4c2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" fill="#152014"/>

  <!-- mossy earth patches -->
  <ellipse cx="30" cy="40" rx="30" ry="20" fill="#1e3018" opacity="0.8"/>
  <ellipse cx="95" cy="90" rx="34" ry="22" fill="#213a1e" opacity="0.8"/>
  <ellipse cx="60" cy="110" rx="20" ry="10" fill="#2a4a26" opacity="0.6"/>

  <!-- root lines -->
  <path d="M0 100 Q20 90 30 105 T60 100" fill="none" stroke="#3a2a18" stroke-width="3" opacity="0.6"/>
  <path d="M90 20 Q100 40 85 55" fill="none" stroke="#3a2a18" stroke-width="3" opacity="0.5"/>

  <!-- god rays -->
  <polygon points="10,0 40,0 20,128 -10,128" fill="url(#godRay)"/>
  <polygon points="70,0 90,0 60,128 40,128" fill="url(#godRay)" opacity="0.6"/>

  <!-- floral accents -->
  <circle cx="45" cy="70" r="3" fill="#e04fc9"/>
  <circle cx="100" cy="40" r="2.5" fill="#f2d23a"/>
  <circle cx="20" cy="105" r="2" fill="#e04fc9"/>
</svg>
